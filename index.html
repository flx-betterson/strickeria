<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Strickeria</title>
<style>
  :root { --ink:#111; --paper:#f6f5f0; --muted:#7d7d77; --line:#d9d8d1; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font:16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 16px; padding-bottom:max(24px, env(safe-area-inset-bottom));
  }
  .logo { font-weight:800; letter-spacing:-.04em; font-size:clamp(28px, 8vw, 44px); line-height:1; margin:0 0 32px; }
  main { width:100%; max-width:360px; text-align:center; }
  form { display:flex; flex-direction:column; gap:12px; }
  label { font-size:14px; color:var(--muted); }
  input, button { font:inherit; border-radius:0; }
  input {
    width:100%; padding:14px 12px; border:1px solid var(--ink); background:transparent; color:var(--ink);
    text-align:center; font-size:18px;
  }
  input:focus-visible, button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  button { padding:14px 12px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-weight:600; cursor:pointer; }
  button:hover { background:#000; }
  .err { min-height:1.5em; margin:0; font-size:14px; color:var(--ink); }
  #player { display:none; width:100%; max-width:460px; text-align:center; }
  #player video { width:100%; max-height:calc(100dvh - 140px); background:#000; display:block; margin:0 auto; }
  .unlocked #gate { display:none; }
  .unlocked #player { display:block; }
  .unlocked .logo { margin-bottom:20px; font-size:clamp(22px, 6vw, 30px); }
</style>
</head>
<body>
  <h1 class="logo">STRICKERIA</h1>

  <main id="gate">
    <form id="form" autocomplete="off">
      <label for="pw">Passwort von deiner Karte</label>
      <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button type="submit">Video ansehen</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </main>

  <section id="player">
    <video id="v" controls playsinline preload="none" poster="poster.jpg"></video>
  </section>

<script>
(function () {
  // Casual gate: the password is checked against a salted SHA-256 hash.
  // This hides the player, it does NOT protect video.mp4 from someone who finds its URL.
  var HASH = "22597b8e9166a7d89ba59114add3678b5534f8d9b4836ce933361355c78c5171";
  var SALT = "strickeria:";
  var KEY = "strickeria-unlocked";
  var body = document.body, err = document.getElementById("err"), v = document.getElementById("v");

  function unlock() {
    v.src = "video.mp4";
    body.classList.add("unlocked");
  }
  function sha256Hex(s) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (buf) {
      return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    });
  }

  try { if (sessionStorage.getItem(KEY) === HASH) unlock(); } catch (e) {}

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    err.textContent = "";
    if (!window.crypto || !crypto.subtle) { err.textContent = "Bitte öffne die Seite über https."; return; }
    sha256Hex(SALT + document.getElementById("pw").value.trim()).then(function (h) {
      if (h === HASH) {
        try { sessionStorage.setItem(KEY, HASH); } catch (e) {}
        unlock();
      } else {
        err.textContent = "Das Passwort stimmt nicht. Bitte prüfe die Schreibweise.";
        document.getElementById("pw").select();
      }
    });
  });
})();
</script>
</body>
</html>
